<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detector de Gestos</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #101820;
            color: white;
        }

        h1 {
            margin-top: 28px;
            font-size: 34px;
        }

        p {
            font-size: 18px;
        }

        img {
            width: 640px;
            max-width: 92vw;
            border: 4px solid #38bdf8;
            border-radius: 12px;
            background: #000;
        }

        #popup {
            display: none;
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 18px 30px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 10px 30px #00000066;
            z-index: 10;
        }

        #popupHangLoose {
            display: none;
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #0ea5e9;
            color: white;
            padding: 18px 30px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 10px 30px #00000066;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="popup">
        👍 Joinha reconhecido!
    </div>

    <div id="popupHangLoose">
        🤙 Hang Loose reconhecido!
    </div>

    <h1>Detector de Gestos</h1>

    <p>
        Mostre um 👍 Joinha ou 🤙 Hang Loose para a câmera.
    </p>

    <img src="/video_feed" alt="Imagem da webcam">

    <script>
        let popupAberto = false;

        async function verificarGesto() {

            const resposta = await fetch('/gesture_status');
            const dados = await resposta.json();

            if (dados.joinha && !popupAberto) {

                popupAberto = true;

                const popup =
                    document.getElementById('popup');

                popup.style.display = 'block';

                setTimeout(() => {
                    popup.style.display = 'none';
                    popupAberto = false;
                }, 2000);
            }

            if (dados.hangloose && !popupAberto) {

                popupAberto = true;

                const popup =
                    document.getElementById('popupHangLoose');

                popup.style.display = 'block';

                setTimeout(() => {
                    popup.style.display = 'none';
                    popupAberto = false;
                }, 2000);
            }
        }

        setInterval(verificarGesto, 500);
    </script>

</body>
</html>
