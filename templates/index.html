<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Controle da Máquina</title>


<style>


body{

    margin:0;

    min-height:100vh;

    background:#101820;

    color:white;

    font-family:Arial;

    text-align:center;

}



h1{

    margin-top:25px;

}



#maquina{

    font-size:90px;

    margin:20px;

    transition:.3s;

}



.ligada{

    color:#22c55e;

    text-shadow:
    0 0 25px #22c55e;

}



.desligada{

    color:#ef4444;

    text-shadow:
    0 0 25px #ef4444;

}



#estado{

    font-size:28px;

}




.camera{


    width:640px;

    max-width:90vw;

    border-radius:15px;

    border:4px solid #38bdf8;

    margin-top:20px;


}





table{


    margin:30px auto;

    width:80%;

    border-collapse:collapse;


}




th,td{


    border:1px solid white;

    padding:10px;


}





/* IMAGEM DO GESTO */

#imagemDedo{


    display:none;


    position:fixed;


    top:50%;


    left:50%;


    transform:translate(-50%,-50%);


    background:black;


    padding:20px;


    border-radius:20px;


    z-index:9999;


    box-shadow:

    0 0 40px black;


}





#imagemDedo img{


    width:450px;

    max-width:80vw;

    border-radius:15px;


}





#popup{


    display:none;


    position:fixed;


    top:20px;


    left:50%;


    transform:translateX(-50%);


    background:#0ea5e9;


    padding:15px 30px;


    border-radius:15px;


    font-size:22px;


    z-index:999;



}



</style>


</head>






<body>



<h1>

Controle da Máquina

</h1>



<h2>

Usuário: {{usuario}}

</h2>





<div id="maquina">

⚙️

</div>




<h2 id="estado">

Carregando...

</h2>





<img

class="camera"

src="/video_feed"

>



<!-- COMEÇA ESCONDIDO -->

<div id="imagemDedo">


<img

src="/static/gestoinadequado.jpg"

alt="Gesto inadequado"


>


</div>





<div id="popup">

Gesto detectado

</div>






<h2>

Histórico

</h2>






<table>


<thead>


<tr>

<th>Usuário</th>

<th>Horário</th>

<th>Gesto</th>

<th>Estado</th>


</tr>


</thead>



<tbody id="historico">


</tbody>


</table>








<script>




async function atualizar(){



    const resposta =
    await fetch("/status");



    const dados =
    await resposta.json();





    let maquina =
    document.getElementById("maquina");



    let estado =
    document.getElementById("estado");






    estado.innerHTML =
    dados.maquina;







    if(dados.ligada){


        maquina.className="ligada";

    }


    else{


        maquina.className="desligada";

    }







    if(dados.mostrar_imagem === true){



        let imagem =
        document.getElementById("imagemDedo");



        imagem.style.display="block";



        setTimeout(()=>{


            imagem.style.display="none";


        },3000);



    }









    if(dados.gesto!="nenhum"){


        mostrarPopup(
            dados.gesto
        );


    }








    let tabela="";



    dados.historico.forEach(item=>{


        tabela += `


        <tr>


        <td>${item.usuario}</td>


        <td>${item.horario}</td>


        <td>${item.gesto}</td>


        <td>${item.estado}</td>


        </tr>


        `;


    });




    document.getElementById("historico")
    .innerHTML=tabela;



}









function mostrarPopup(gesto){


    let popup =
    document.getElementById("popup");



    if(gesto=="joinha"){


        popup.innerHTML=
        "👍 Máquina ligada";


    }



    else if(gesto=="hangloose"){


        popup.innerHTML=
        "🤙 Máquina desligada";


    }



    else if(gesto=="dedo_meio"){


        popup.innerHTML=
        "🖕 Gesto detectado";


    }






    popup.style.display="block";



    setTimeout(()=>{


        popup.style.display="none";


    },1500);



}







setInterval(

atualizar,

1000

);



atualizar();



</script>






</body>


</html>
